<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.aerisapi.com/sdk/js/mapsgl/latest/aerisweather.mapsgl.css" rel="stylesheet" />
    <script defer src="https://cdn.aerisapi.com/sdk/js/mapsgl/latest/aerisweather.mapsgl.js"></script>
    <title>WeatherWatch</title>
    <script type="module" crossorigin src="./assets/index-C1hQBIyv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cjo7-GEX.css">
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script>
      (function () {
        function requestAtticRadar() {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'storm-grid-open-radar' }, window.location.origin);
            }
          } catch (_) {}
        }

        function isRadarTarget(node) {
          if (!node || node.nodeType !== 1) return false;
          var text = (node.textContent || '').trim().toLowerCase();
          var title = (node.getAttribute('title') || '').trim().toLowerCase();
          var href = (node.getAttribute('href') || '').trim().toLowerCase();
          var aria = (node.getAttribute('aria-label') || '').trim().toLowerCase();
          var dataTab = (node.getAttribute('data-tab') || '').trim().toLowerCase();
          return text === 'radar' || title === 'radar' || aria === 'radar' || dataTab === 'radar' || href.indexOf('tab=radar') >= 0;
        }

        function patchRadarTab() {
          var targets = Array.prototype.slice.call(document.querySelectorAll('button, a, [role=\"button\"], [data-tab]'));
          targets.forEach(function (target) {
            if (!isRadarTarget(target)) return;
            if (target.dataset.atticRadarPatched === '1') return;

            target.dataset.atticRadarPatched = '1';
            if ((target.textContent || '').trim().toLowerCase() === 'radar') {
              target.textContent = 'Radar Workspace';
            }
            target.setAttribute('title', 'Open Attic Radar Workspace');
            target.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              requestAtticRadar();
            }, true);
          });
        }

        document.addEventListener('click', function (event) {
          var target = event.target && event.target.closest ? event.target.closest('button, a, [role=\"button\"], [data-tab]') : null;
          if (!isRadarTarget(target)) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          requestAtticRadar();
        }, true);

        var observer = new MutationObserver(function () {
          patchRadarTab();
        });

        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', patchRadarTab);
        patchRadarTab();
      })();
    </script>
  </body>
</html>
